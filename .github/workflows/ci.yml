name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-boundary-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Enforce module dependency direction
        shell: bash
        run: |
          set -euo pipefail
          if grep -n 'voltops-reference' flowforge-engine/pom.xml; then
            echo 'flowforge-engine must not depend on voltops-reference.'
            exit 1
          fi
          if ! grep -n 'flowforge-engine' voltops-reference/pom.xml; then
            echo 'voltops-reference must depend on flowforge-engine.'
            exit 1
          fi
          if ! grep -n 'flowforge-engine' flowforge-application/pom.xml || ! grep -n 'voltops-reference' flowforge-application/pom.xml; then
            echo 'flowforge-application must depend on both library modules.'
            exit 1
          fi

      - name: Enforce executable boundary
        shell: bash
        run: |
          set -euo pipefail
          if grep -Rni 'spring-boot-maven-plugin' flowforge-engine/pom.xml voltops-reference/pom.xml; then
            echo 'Reusable library modules must not package executable Spring Boot applications.'
            exit 1
          fi
          if ! grep -Rni 'spring-boot-maven-plugin' flowforge-application/pom.xml; then
            echo 'flowforge-application must own the Spring Boot packaging plugin.'
            exit 1
          fi

      - name: Enforce FlowForge domain boundary
        shell: bash
        run: |
          set -euo pipefail
          if grep -RniE 'transformer|technician|shutdown[ _-]?permit' flowforge-engine \
            --exclude-dir=target --exclude='*.class'; then
            echo 'Domain-specific terms found inside flowforge-engine.'
            exit 1
          fi

      - name: Verify build and tests
        run: ./mvnw -B clean verify

      - name: Start healthy local dependencies
        run: docker compose up -d --wait

      - name: Verify container health
        run: docker compose ps

      - name: Stop local dependencies
        if: always()
        run: docker compose down -v
